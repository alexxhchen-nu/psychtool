<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">psychtool — 来源可溯的临床写作工作区</title>
  <desc id="d">左侧为项目名与定位，右侧为一张带来源定位的证据索引卡，虚线表示从材料到陈述的溯源路径。</desc>
  <rect width="1200" height="320" rx="16" fill="#FAF8F2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="52" font-size="18" fill="#6E7681">// CLINICAL WRITING · PSYCHOLOGY · RESEARCH STAGE</text>
    <text x="64" y="270" font-size="18" fill="#6E7681">▰ research + spec  ▱ application (not built)</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="120" font-size="64" font-weight="700" fill="#1F2430">psychtool</text>
    <text x="64" y="160" font-size="24" fill="#1F2430">来源可溯的临床写作工作区</text>
    <text x="64" y="196" font-size="20" fill="#6E7681">每条陈述都能回到来源 —— every claim traces back</text>
