<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">psychtool 工作流：材料到导出，经过人工审阅门禁</title>
  <desc id="d">五个步骤的横向流程：材料、事实清单、带来源草稿、人工审阅门禁、导出；来源修改会让相关草稿回到重新核对。</desc>
  <rect width="1200" height="360" rx="16" fill="#FAF8F2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6E7681">
    <text x="64" y="52">// FIRST WORKFLOW — SYNTHETIC TRAINING DATA ONLY</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="64" y="88" width="168" height="88" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
      <text x="132" y="126" font-size="22" font-weight="600" fill="#1F2430" text-anchor="middle">材料</text>
      <text x="132" y="156" font-size="18" fill="#6E7681" text-anchor="middle" font-family="ui-monospace, monospace">sources</text>
    </g>
    <g>
      <rect x="280" y="88" width="168" height="88" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
      <text x="364" y="126" font-size="22" font-weight="600" fill="#1F2430" text-anchor="middle">事实清单</text>
      <text x="364" y="156" font-size="18" fill="#6E7681" text-anchor="middle" font-family="ui-monospace, monospace">claims</text>
    </g>
    <g>
      <rect x="496" y="88" width="168" height="88" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
      <text x="580" y="126" font-size="22" font-weight="600" fill="#1F2430" text-anchor="middle">带来源草稿</text>
      <text x="580" y="156" font-size="18" fill="#6E7681" text-anchor="middle" font-family="ui-monospace, monospace">draft+refs</text>
    </g>
    <g>
      <rect x="712" y="72" width="184" height="120" rx="10" fill="#EEF2FF" stroke="#4C6EF5"/>
      <text x="804" y="118" font-size="22" font-weight="700" fill="#4C6EF5" text-anchor="middle">人工审阅 ▣</text>
      <text x="804" y="148" font-size="18" fill="#4C6EF5" text-anchor="middle" font-family="ui-monospace, monospace">human gate</text>
      <text x="804" y="174" font-size="17" fill="#6E7681" text-anchor="middle">本人 + 督导</text>
    </g>
    <g>
      <rect x="944" y="88" width="168" height="88" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
      <text x="1028" y="126" font-size="22" font-weight="600" fill="#1F2430" text-anchor="middle">导出</text>
      <text x="1028" y="156" font-size="18" fill="#6E7681" text-anchor="middle" font-family="ui-monospace, monospace">export</text>
    </g>
  </g>
  <g stroke="#1F2430" stroke-width="2" fill="none">
    <path d="M232 132 H272" marker-end="url(#a)"/>
    <path d="M448 132 H488" marker-end="url(#a)"/>
    <path d="M664 132 H704" marker-end="url(#a)"/>
    <path d="M896 132 H936" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#1F2430"/>
    </marker>
  </defs>
  <path d="M148 176 V240 H580 V184" stroke="#6E7681" stroke-width="2" fill="none" stroke-dasharray="4 6" marker-end="url(#b)"/>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#6E7681"/>
    </marker>
  </defs>
  <text x="364" y="264" font-size="18" fill="#6E7681" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">来源被修改 → 相关草稿回到重新核对（旧核对状态失效）</text>
  <text x="64" y="312" font-size="18" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">约束：不自动诊断 · 不解释量表 · 不静默调和矛盾 · 缺失即标注未知</text>
  <text x="1112" y="312" font-size="18" fill="#4C6EF5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">evidence &gt; fluency</text>
</svg>
