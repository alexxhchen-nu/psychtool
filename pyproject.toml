[project]
name = "psychtool"
version = "0.1.0"
description = "Source-traceable clinical writing workspace (research stage, synthetic materials only)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "textual>=0.80",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# The live Vertex chapter path (ADR 0024) needs the official google-genai SDK.
# It stays optional so the default test run and CI never install it.
live = ["google-genai>=2.34.0"]

[project.scripts]
psychtool = "psychtool.cli.app:app"
psychtool-server = "psychtool.server.main:main"
psychtool-live-vertex = "psychtool.live.vertex_chapter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["psychtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
